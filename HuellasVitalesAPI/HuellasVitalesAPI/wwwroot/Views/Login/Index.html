<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huellitas Vitales</title>

<link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">

<style>
:root {
    --pine: #1B4332;
    --mint: #52B788;
    --cream: #FEFAE0;
}

body {
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container-main {
    text-align: center;
}

.logo {
    width: 80px;
    margin-bottom: 20px;
}

h1 {
    color: var(--pine);
    font-weight: bold;
}

p {
    color: #555;
    margin-bottom: 30px;
}

.btn-custom {
    padding: 10px 25px;
    border-radius: 10px;
    margin: 5px;
}

.btn-login {
    background: var(--pine);
    color: white;
}

.btn-register {
    background: var(--mint);
    color: white;
}
</style>
</head>

<body>

<div class="container-main">

    <!-- Logo -->
    <img src="Imagenes/logo.png" alt="Logo" width="200" height="150">

    <h1>Huellitas Vitales</h1>
    <p>Cuida la salud de tus mascotas de forma inteligente 🐾</p>

    <!-- Botones -->
    <a href="login.html" class="btn btn-custom btn-login">Iniciar Sesión</a>
    <a href="register.html" class="btn btn-custom btn-register">Registrarse</a>

</div>

</body>
</html>
